[Xiao_S3_WIO_WeatherStation]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
build_flags = ${esp32_base.build_flags}
  -I variants/xiao_s3_wio_weatherstation
  -D SEEED_XIAO_S3
  -D P_LORA_DIO_1=39
  -D P_LORA_NSS=41
  -D P_LORA_RESET=42   ; RADIOLIB_NC
  -D P_LORA_BUSY=40   ;  DIO2 = 38
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=8
  -D P_LORA_MOSI=9
  -D PIN_USER_BTN=21
  -D PIN_STATUS_LED=48
  -D PIN_BOARD_SDA=-1   ; no I2C used in this project -- D4/D5 (GPIO5/6) repurposed for CC1101 GDO0/GDO2 below
  -D PIN_BOARD_SCL=-1
  -D SX126X_RXEN=38
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
  ; --- CC1101 (secondary SPI bus, separate from the SX1262 above) ---
  ; Physical wiring: SCK=D0(GPIO1) MOSI=D1(GPIO2) MISO/GDO1=D2(GPIO3)
  ; CSN=D3(GPIO4) GDO0=D4(GPIO5) GDO2=D5(GPIO6)
  -URADIOLIB_EXCLUDE_CC1101   ; this repo excludes CC1101 from RadioLib by default; we need it
  -D RF_CC1101="CC1101"
  -D RF_MODULE_SCK=1
  -D RF_MODULE_MISO=3
  -D RF_MODULE_MOSI=2
  -D RF_MODULE_CS=4
  -D RF_MODULE_GDO0=5
  -D RF_MODULE_GDO2=6
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_s3_wio_weatherstation>
  +<helpers/sensors/WeatherStationSensorManager.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  bblanchon/ArduinoJson @ ^7
  ; Fork of garethm79/rtl_433_ESP with a WS69-aware fineoffset.c decoder
  ; (upstream NorthernMan54/rtl_433_ESP doesn't have it yet) and MY_DEVICES
  ; fixed to isolate weather-station decoders -- running the full ~280-device
  ; list against every capture corrupts/truncates reception on this hardware,
  ; see https://github.com/NorthernMan54/rtl_433_ESP/issues/164
  https://github.com/mresnick/rtl_433_ESP.git

[env:Xiao_S3_WIO_weatherstation_sensor]
extends = Xiao_S3_WIO_WeatherStation
build_src_filter = ${Xiao_S3_WIO_WeatherStation.build_src_filter}
  +<../examples/weatherstation_sensor/*.cpp>
build_flags =
  ${Xiao_S3_WIO_WeatherStation.build_flags}
  ; ADVERT_NAME left unset -- the firmware computes a name unique to each
  ; device from its chip ID (e.g. "Weather Station a3f2") on first boot.
  ; Change it later with the mesh CLI ("set name ...") or web configurator.
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ; No adverts (zero-hop or flood) on boot -- this node is query-only.
  -D ENABLE_ADVERT_ON_BOOT=0
  ; Fine Offset weather-station family (WH24/WH65B/WS69 etc), US 915MHz, FSK
  -D RF_MODULE_FREQUENCY=915.00
  -D OOK_MODULATION=false
  ; Only compile weather-station decoders -- see lib_deps comment above
  -D MY_DEVICES=true
  -D RF_MODULE_INIT_STATUS=true
  -D RTL_DEBUG=2
  -D FSK_DROPOUT_GATE_US=4000
  -D PUBLISH_UNPARSED=true
;  -D WEATHERSTATION_MOCK_DATA=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  ; First-boot default trigger command. The device also joins a default
  ; group channel unique to it (also derived from its chip ID) on first
  ; boot. Both the trigger text and channel membership are then persisted
  ; to flash and configurable at runtime via the "get/set trigger" and
  ; "channel" CLI commands, or the web configurator.
  -D WEATHER_COMMAND='"!weather"'
lib_deps =
  ${Xiao_S3_WIO_WeatherStation.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
